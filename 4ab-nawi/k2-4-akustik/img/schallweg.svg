<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" width="640" height="660" role="img" aria-label="Schallgeschwindigkeit, Gewitterregel und Echo"><title>Schallgeschwindigkeit, Gewitterregel und Echo</title><style>text{font-family:'Source Sans 3','Carlito','Segoe UI',Arial,sans-serif;fill:#1F2A1C} .b{font-weight:700} .m{fill:#5E6652} </style><rect width='640' height='660' rx='18' fill='#F2F3EE'/><text x='24' y='44' font-size='28' text-anchor='start' class='b'>Wie schnell ist Schall?</text><text x='24' y='110' font-size='24' text-anchor='start' class='b'>Luft</text><rect x='130' y='88' width='26' height='32' rx='8' fill='#2E7D8C'/><text x='166' y='112' font-size='22' text-anchor='start'>340 m/s</text><text x='24' y='166' font-size='24' text-anchor='start' class='b'>Wasser</text><rect x='130' y='144' width='98' height='32' rx='8' fill='#2A5C8C'/><text x='237.68' y='168' font-size='22' text-anchor='start'>rund 1 480 m/s</text><text x='24' y='222' font-size='24' text-anchor='start' class='b'>Stahl</text><rect x='130' y='200' width='330' height='32' rx='8' fill='#3B4A2F'/><text x='470.0' y='224' font-size='22' text-anchor='start'>rund 5 000 m/s</text><text x='24' y='290' font-size='24' text-anchor='start' class='b'>Gewitter: Sekunden durch 3 = Kilometer</text><polygon points='60,310 40,360 58,360 44,405 82,342 64,342 80,310' fill='#E8C02E' stroke='#1F2A1C' stroke-width='2'/><line x1='110' y1='360' x2='110' y2='380' stroke='#1F2A1C' stroke-width='3'/><text x='110' y='408' font-size='22' text-anchor='middle'>0 km</text><text x='110' y='350' font-size='22' text-anchor='middle' class='m'>0 s</text><line x1='270' y1='360' x2='270' y2='380' stroke='#1F2A1C' stroke-width='3'/><text x='270' y='408' font-size='22' text-anchor='middle'>1 km</text><text x='270' y='350' font-size='22' text-anchor='middle' class='m'>3 s</text><line x1='430' y1='360' x2='430' y2='380' stroke='#1F2A1C' stroke-width='3'/><text x='430' y='408' font-size='22' text-anchor='middle'>2 km</text><text x='430' y='350' font-size='22' text-anchor='middle' class='m'>6 s</text><line x1='590' y1='360' x2='590' y2='380' stroke='#1F2A1C' stroke-width='3'/><text x='590' y='408' font-size='22' text-anchor='middle'>3 km</text><text x='590' y='350' font-size='22' text-anchor='middle' class='m'>9 s</text><line x1='110' y1='370' x2='590' y2='370' stroke='#1F2A1C' stroke-width='3'/><text x='24' y='470' font-size='24' text-anchor='start' class='b'>Echo: hin UND zurück</text><rect x='560' y='490' width='56' height='150' fill='#EADFC8' stroke='#5E6652' stroke-width='2'/><text x='588' y='574' font-size='20' text-anchor='middle' class='m'>Fels</text><circle cx='60' cy='565' r='26' fill='#F1C9A8' stroke='#1F2A1C' stroke-width='2'/><line x1='100.0' y1='540.0' x2='539.6' y2='540.0' stroke='#D9772B' stroke-width='5' stroke-linecap='round'/><polygon points='548.0,540.0 535.4,546.1 535.4,533.9' fill='#D9772B'/><line x1='548.0' y1='590.0' x2='108.4' y2='590.0' stroke='#2E7D8C' stroke-width='5' stroke-linecap='round'/><polygon points='100.0,590.0 112.6,583.9 112.6,596.1' fill='#2E7D8C'/><text x='324' y='528' font-size='22' text-anchor='middle' fill='#D9772B'>hin: s</text><text x='324' y='624' font-size='22' text-anchor='middle' fill='#2E7D8C'>zurück: s</text><text x='24' y='652' font-size='22' text-anchor='start' class='b'>Gemessene Zeit gilt für 2 · s  →  s = v · t / 2</text></svg>