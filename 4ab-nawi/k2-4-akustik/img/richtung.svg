<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" role="img" aria-label="Animation: Der Knall erreicht zuerst das linke Ohr und mit Umweg um den Kopf etwas später und leiser das rechte Ohr"><title>Animation: Der Knall erreicht zuerst das linke Ohr und mit Umweg um den Kopf etwas später und leiser das rechte Ohr</title><style>text{font-family:'Source Sans 3','Carlito','Segoe UI',Arial,sans-serif;fill:#1F2A1C} .b{font-weight:700} .m{fill:#5E6652} @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width='640' height='560' rx='18' fill='#F2F3EE'/><text x='24' y='44' font-size='28' text-anchor='start' class='b'>Richtungshören: Kopf von oben</text><path d='M400 160 L610 130 L610 450 L400 420 Z' fill='#E4E7DD' opacity='.9'/><text x='600' y='150' font-size='21' text-anchor='end' class='m'>Schallschatten</text><circle cx='380' cy='290' r='110' fill='#F1C9A8' stroke='#1F2A1C' stroke-width='3'/><path d='M362 184 L380 158 L398 184' fill='#F1C9A8' stroke='#1F2A1C' stroke-width='3'/><text x='380' y='150' font-size='20' text-anchor='middle' class='m'>vorne</text><ellipse cx='270' cy='290' rx='12' ry='26' fill='#F1C9A8' stroke='#1F2A1C' stroke-width='3'/><ellipse cx='490' cy='290' rx='12' ry='26' fill='#F1C9A8' stroke='#1F2A1C' stroke-width='3'/><text x='294' y='296' font-size='20' text-anchor='start' class='b'>links</text><text x='466' y='296' font-size='20' text-anchor='end' class='b'>rechts</text><circle cx='70' cy='290' r='20' fill='#A33A2B'/><path d='M112 256 Q130 290 112 324' fill='none' stroke='#A33A2B' stroke-width='3'/><path d='M134 248 Q156 290 134 332' fill='none' stroke='#A33A2B' stroke-width='3'/><path d='M156 240 Q182 290 156 340' fill='none' stroke='#A33A2B' stroke-width='3'/><text x='70' y='346' font-size='22' text-anchor='middle' class='b' fill='#A33A2B'>Knall</text><line x1='94.0' y1='290.0' x2='245.6' y2='290.0' stroke='#D9772B' stroke-width='5' stroke-linecap='round'/><polygon points='254.0,290.