# Kontrolle nach jedem Push: Fremdserver, Token, Skriptfehler, fehlender Speicherstatus, umbenannte Speicherschlüssel.
# Rot = bitte nachsehen (die Seiten sind trotzdem online). Anleitung: werkzeug/pruefen.py
name: Seiten pruefen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python3 werkzeug/pruefen.py
      - name: Lehrer- und Kadettennavigation getrennt
        run: python3 werkzeug/test_lehrer_navigation.py
      - name: Kadettenansicht und Materialwege
        run: |
          python3 werkzeug/test_kadetten_layout.py
          node --check gemeinsam/kadetten-navigation-v1.js
      # Antwort-Tests der großzügigen Prüfung (richtige Antworten gelten, falsche nicht) – rot bei jeder Abweichung
      - name: Antwort-Tests
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cd "$GITHUB_WORKSPACE" && NODE_PATH=/tmp/pw/node_modules node werkzeug/test_nachsicht.js
