# Knopf zum Ein-/Ausblenden einer Einheit für eine Klasse:
# GitHub -> Actions -> »Einheit ein-/ausblenden« -> Run workflow (geht auch in der GitHub-App am Handy).
name: Einheit ein-/ausblenden

on:
  workflow_dispatch:
    inputs:
      ordner:
        description: "Ordner der Einheit, z. B. 1ak-nawi/k1-2-2-koerper (Liste: Lehrer-Seite)"
        required: true
      aktion:
        description: "Was soll passieren?"
        type: choice
        options: [ausblenden, einblenden]
        default: ausblenden

permissions:
  contents: write

concurrency:
  group: klassenseiten
  cancel-in-progress: false

jobs:
  umschalten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4 lxml "qrcode[pil]"
      - name: Einheit umschalten und Seiten neu bauen
        env:
          TZ: Europe/Vienna
          ORDNER: ${{ inputs.ordner }}
          AKTION: ${{ inputs.aktion }}
        run: |
          python3 werkzeug/einheit_sichtbar.py "$ORDNER" "$AKTION"
          python3 werkzeug/build_index.py
      - name: Speichern
        run: |
          git config user.name "Klassenseiten-Automatik"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Einheit $ORDNER: $AKTION" && git push
        env:
          ORDNER: ${{ inputs.ordner }}
          AKTION: ${{ inputs.aktion }}
