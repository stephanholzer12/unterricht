<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" role="img" aria-label="Blutröhrchen mit 55 Prozent Plasma und 45 Prozent Zellen; rote und weiße Blutkörperchen und Blutplättchen mit ihren Aufgaben"><title>Blutröhrchen mit 55 Prozent Plasma und 45 Prozent Zellen; rote und weiße Blutkörperchen und Blutplättchen mit ihren Aufgaben</title><style>text{font-family:'Source Sans 3','Carlito','Segoe UI',Arial,sans-serif;fill:#1F2A1C} .b{font-weight:700} .m{fill:#5E6652} </style><rect width='640' height='520' rx='18' fill='#F2F3EE'/><text x='320' y='38' font-size='24' text-anchor='middle' class='b'>Was im Blut steckt</text><rect x='60' y='70' width='90' height='360' rx='40' fill='#fff' stroke='#5E6652' stroke-width='4'/><rect x='64' y='74' width='82' height='196' rx='36' fill='#F3DC8A'/><rect x='64' y='270' width='82' height='156' rx='0' fill='#A33A2B'/><rect x='64' y='264' width='82' height='8' fill='#F4F1E8'/><line x1='160' y1='170' x2='150' y2='170' stroke='#5E6652' stroke-width='2'/><circle cx='150' cy='170' r='4' fill='#5E6652'/><text x='168' y='162' font-size='21' text-anchor='start' class='b'>Plasma ≈ 55 %</text><text x='168' y='186' font-size='17' text-anchor='start' class='m'>90 % Wasser, Eiweiße, Salze,</text><text x='168' y='206' font-size='17' text-anchor='start' class='m'>Nährstoffe, Hormone</text><line x1='160' y1='350' x2='150' y2='350' stroke='#5E6652' stroke-width='2'/><circle cx='150' cy='350' r='4' fill='#5E6652'/><text x='168' y='344' font-size='21' text-anchor='start' class='b' fill='#A33A2B'>Blutzellen ≈ 45 %</text><text x='168' y='368' font-size='17' text-anchor='start' class='m'>(Hämatokrit)</text><text x='105' y='460' font-size='16' text-anchor='middle' class='m'>nach dem Schleudern</text><ellipse cx='470' cy='120' rx='42' ry='42' fill='#A33A2B'/><ellipse cx='470' cy='120' rx='18' ry='18' fill='#8C2A20'/><text x='470' y='190' font-size='20' text-anchor='middle' class='b' fill='#A33A2B'>rote Blutkörperchen</text><text x='470' y='212' font-size='17' text-anchor='middle' class='m'>Sauerstoff · Hämoglobin</text><circle cx='440' cy='290' r='38' fill='#EDE7F2' stroke='#6B4E8C' stroke-width='3'/><path d='M424 280 q14 -18 28 0 q10 18 -8 22 q-18 4 -20 -22' fill='#9C82BC'/><text x='440' y='352' font-size='20' text-anchor='middle' class='b' fill='#6B4E8C'>weiße Blutkörperchen</text><text x='440' y='374' font-size='17' text-anchor='middle' class='m'>Abwehr</text><polygon points='540,270 552,276 544,286 534,278' fill='#D9772B'/><polygon points='565,300 577,306 569,316 559,308' fill='#D9772B'/><polygon points='550,320 562,326 554,336 544,328' fill='#D9772B'/><text x='555' y='420' font-size='20' text-anchor='middle' class='b' fill='#D9772B'>Blutplättchen</text><text x='555' y='442' font-size='17' text-anchor='middle' class='m'>Wundverschluss</text><text x='320' y='500' font-size='20' text-anchor='middle' class='b'>Alle Blutzellen entstehen im roten Knochenmark.</text></svg>