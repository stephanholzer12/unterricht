' y='250' font-size='17' text-anchor='middle' class='m'>Merkmal: A und B</text><text x='400' y='350' font-size='19' text-anchor='middle' class='m'>keine</text><text x='555' y='90' font-size='32' text-anchor='middle' class='b'>0</text><circle cx='555' cy='170' r='46' fill='#A33A2B'/><circle cx='555' cy='170' r='20' fill='#8C2A20'/><text x='555' y='250' font-size='17' text-anchor='middle' class='m'>Merkmal: keines</text><path d='M555 350 V330 L541 312 M555 330 L569 312' fill='none' stroke='#2E7D8C' stroke-width='6' stroke-linecap='round'/><text x='577' y='340' font-size='17' text-anchor='start' class='b' fill='#2E7D8C'>Anti-A</text><path d='M555 410 V390 L541 372 M555 390 L569 372' fill='none' stroke='#D99A00' stroke-width='6' stroke-linecap='round'/><text x='577' y='400' font-size='17' text-anchor='start' class='b' fill='#D99A00'>Anti-B</text><text x='20' y='300' font-size='18' text-anchor='start' class='b'>Antikörper im Plasma:</text><text x='320' y='470' font-size='20' text-anchor='middle' class='b'>Antikörper treffen auf ihr Merkmal → das Blut verklumpt.</text><text x='320' y='500' font-size='18' text-anchor='middle' class='m'>■ Merkmal A   ▲ Merkmal B</text></svg>