<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" role="img" aria-label="Vier Kästen HERZ, BLUT, MUSKELN, KNOCHEN mit Pfeilen: Herz pumpt Blut, Blut bringt Sauerstoff zu den Muskeln, Muskeln ziehen an Knochen, Knochenmark bildet Blut"><title>Vier Kästen HERZ, BLUT, MUSKELN, KNOCHEN mit Pfeilen: Herz pumpt Blut, Blut bringt Sauerstoff zu den Muskeln, Muskeln ziehen an Knochen, Knochenmark bildet Blut</title><style>text{font-family:'Source Sans 3','Carlito','Segoe UI',Arial,sans-serif;fill:#1F2A1C} .b{font-weight:700} .m{fill:#5E6652} </style><rect width='640' height='520' rx='18' fill='#F2F3EE'/><text x='320' y='38' font-size='24' text-anchor='middle' class='b'>Der Körper unter Belastung</text><rect x='50' y='80' width='240' height='100' rx='18' fill='#fff' stroke='#A33A2B' stroke-width='5'/><text x='170' y='122' font-size='26' text-anchor='middle' class='b' fill='#A33A2B'>HERZ</text><text x='170' y='154' font-size='18' text-anchor='middle' class='m'>pumpt: rechts Lunge, links Körper</text><rect x='350' y='80' width='240' height='100' rx='18' fill='#fff' stroke='#8C2A20' stroke-width='5'/><text x='470' y='122' font-size='26' text-anchor='middle' class='b' fill='#8C2A20'>BLUT</text><text x='470' y='154' font-size='18' text-anchor='middle' class='m'>bringt Sauerstoff, wehrt ab</text><rect x='350' y='330' width='240' height='100' rx='18' fill='#fff' stroke='#B05A3A' stroke-width='5'/><text x='470' y='372' font-size='26' text-anchor='middle' class='b' fill='#B05A3A'>MUSKELN</text><text x='470' y='404' font-size='18' text-anchor='middle' class='m'>ziehen an den Knochen</text><rect x='50' y='330' width='240' height='100' rx='18' fill='#fff' stroke='#8A6A44' stroke-width='5'/><text x='170' y='372' font-size='26' text-anchor='middle' class='b' fill='#8A6A44'>KNOCHEN</text><text x='170' y='404' font-size='18' text-anchor='middle' class='m'>tragen, schützen, bilden Blut</text><line x1='292.0' y1='120.0' x2='339.6' y2='120.0' stroke='#A33A2B' stroke-width='5' stroke-linecap='round'/><polygon points='348.0,120.0 335.4,126.1 335.4,113.9' fill='#A33A2B'/><text x='320' y='100' font-size='16' text-anchor='middle' class='m'>pumpt</text><line x1='470.0' y1='182.0' x2='470.0' y2='319.6' stroke='#8C2A20' stroke-width='5' stroke-linecap='round'/><polygon points='470.0,328.0 463.9,315.4 476.1,315.4' fill='#8C2A20'/><text x='480' y='260' font-size='17' text-anchor='start' class='m'>Sauerstoff</text><line x1='348.0' y1='380.0' x2='300.4' y2='380.0' stroke='#B05A3A' stroke-width='5' stroke-linecap='round'/><polygon points='292.0,380.0 304.6,373.9 304.6,386.1' fill='#B05A3A'/><text x='320' y='365' font-size='16' text-anchor='middle' class='m'>Sehnen</text><line x1='220.0' y1='328.0' x2='413.2' y2='187.0' stroke='#8A6A44' stroke-width='5' stroke-linecap='round'/><polygon points='420.0,182.0 413.4,194.4 406.2,184.5' fill='#8A6A44'/><text x='250' y='245' font-size='17' text-anchor='start' class='m'>Knochenmark</text><text x='250' y='265' font-size='17' text-anchor='start' class='m'>bildet Blut</text><text x='320' y='480' font-size='20' text-anchor='middle' class='b'>Bei Belastung arbeiten alle vier zusammen.</text></svg>