<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 860" width="440" height="860" role="img" aria-label="Muskel, Blut und Lunge halten den Blut-pH mit Puffer und Atmung bei 7,4"><title>Muskel, Blut und Lunge halten den Blut-pH mit Puffer und Atmung bei 7,4</title><style>text{font-family:'Source Sans 3','Carlito','Segoe UI',Arial,sans-serif;fill:#1F2A1C} .b{font-weight:700} .m{fill:#5E6652} </style><rect width='440' height='860' rx='18' fill='#F2F3EE'/><text x='20' y='42' font-size='30' text-anchor='start' class='b'>Dein Blut bleibt bei pH 7,4</text><text x='20' y='74' font-size='20' text-anchor='start' class='m'>Puffer fängt H⁺ ab –</text><text x='20' y='100' font-size='20' text-anchor='start' class='m'>die Lunge atmet CO₂ aus.</text><rect x='20' y='124' width='400' height='72' rx='14' fill='#F6D3CF' stroke='#1F2A1C' stroke-width='2'/><text x='38' y='169' font-size='25' text-anchor='start' class='b'>Muskel</text><text x='402' y='169' font-size='19' text-anchor='end'>bildet CO₂ und H⁺</text><line x1='220.0' y1='198.0' x2='220.0' y2='209.6' stroke='#1F2A1C' stroke-width='4' stroke-linecap='round'/><polygon points='220.0,218.0 213.9,205.4 226.1,205.4' fill='#1F2A1C'/><rect x='20' y='220' width='400' height='72' rx='14' fill='#F3C6C6' stroke='#1F2A1C' stroke-width='2'/><text x='38' y='265' font-size='25' text-anchor='start' class='b'>Blut</text><text x='402' y='265' font-size='19' text-anchor='end'>Puffer: HCO₃⁻ fängt H⁺</text><line x1='220.0' y1='294.0' x2='220.0' y2='305.6' stroke='#1F2A1C' stroke-width='4' stroke-linecap='round'/><polygon points='220.0,314.0 213.9,301.4 226.1,301.4' fill='#1F2A1C'/><rect x='20' y='316' width='400' height='72' rx='14' fill='#D6E8F2' stroke='#1F2A1C' stroke-width='2'/><text x='38' y='361' font-size='25' text-anchor='start' class='b'>Lunge</text><text x='402' y='361' font-size='19' text-anchor='end'>atmet CO₂ aus</text><text x='220' y='444' font-size='25' text-anchor='middle' class='b'>HCO₃⁻ + H⁺ → H₂CO₃</text><text x='220' y='476' font-size='25' text-anchor='middle' class='b'>→ H₂O + CO₂</text><text x='220' y='506' font-size='18' text-anchor='middle' class='m'>Das CO₂ verlässt den Körper über die Lunge.</text><text x='256.0000000000002' y='556' font-size='20' text-anchor='middle' class='b' style='fill:#3B4A2F'>normal 7,35–7,45</text><rect x='40' y='568' width='360' height='40' rx='6' fill='#DFE5D0'/><rect x='238.0' y='568' width='36.0' height='40' fill='#7FA83A'/><text x='94.00000000000013' y='595' font-size='17' text-anchor='middle' class='b' style='fill:#8C3B2E'>Azidose</text><text x='349.60000000000014' y='595' font-size='17' text-anchor='middle' class='b' style='fill:#2A5C8C'>Alkalose</text><line x1='158.8' y1='562' x2='158.8' y2='614' stroke='#C0392B' stroke-width='4'/><text x='40.0' y='636' font-size='18' text-anchor='middle' class='b'>6,8</text><text x='112.00000000000006' y='636' font-size='18' text-anchor='middle' class='b'>7,0</text><text x='184.0000000000001' y='636' font-size='18' text-anchor='middle' class='b'>7,2</text><text x='256.0000000000002' y='636' font-size='18' text-anchor='middle' class='b'>7,4</text><text x='327.99999999999994' y='636' font-size='18' text-anchor='middle' class='b'>7,6</text><text x='400.0' y='636' font-size='18' text-anchor='middle' class='b'>7,8</text><text x='220' y='670' font-size='20' text-anchor='middle' class='b' style='fill:#C0392B'>nach hartem Sprint: 7,13</text><text x='220' y='696' font-size='18' text-anchor='middle' style='fill:#C0392B'>kurz und normal – die Atmung gleicht aus</text><rect x='20' y='720' width='400' height='120' rx='12' fill='#3B4A2F'/><text x='220' y='775' font-size='21' text-anchor='middle' class='b' style='fill:#FFFFFF'>Schneller atmen = mehr CO₂ raus</text><text x='220' y='801' font-size='21' text-anchor='middle' class='b' style='fill:#FFFFFF'>= weniger Kohlensäure</text><text x='220' y='822' font-size='15' text-anchor='middle' style='fill:#E7EED8'>Studie: Radsportler, Med Sci Sports Exerc 2023</text></svg>