<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" role="img" aria-label="Muskel, Blut und Lunge halten den Blut-pH mit Puffer und Atmung bei 7,4"><title>Muskel, Blut und Lunge halten den Blut-pH mit Puffer und Atmung bei 7,4</title><style>text{font-family:'Source Sans 3','Carlito','Segoe UI',Arial,sans-serif;fill:#1F2A1C} .b{font-weight:700} .m{fill:#5E6652} </style><rect width='640' height='520' rx='18' fill='#F2F3EE'/><text x='24' y='44' font-size='28' text-anchor='start' class='b'>Dein Blut bleibt bei pH 7,4</text><text x='24' y='74' font-size='20' text-anchor='start' class='m'>Puffer fängt H⁺ ab – die Lunge atmet CO₂ aus.</text><rect x='24' y='100' width='176' height='120' rx='16' fill='#F6D3CF' stroke='#1F2A1C' stroke-width='2'/><text x='112' y='146' font-size='24' text-anchor='middle' class='b'>Muskel</text><text x='112' y='180' font-size='15' text-anchor='middle'>bildet CO₂ und H⁺</text><rect x='232' y='100' width='176' height='120' rx='16' fill='#F3C6C6' stroke='#1F2A1C' stroke-width='2'/><text x='320' y='146' font-size='24' text-anchor='middle' class='b'>Blut</text><text x='320' y='180' font-size='15' text-anchor='middle'>Puffer: HCO₃⁻ fängt H⁺</text><rect x='440' y='100' width='176' height='120' rx='16' fill='#D6E8F2' stroke='#1F2A1C' stroke-width='2'/><text x='528' y='146' font-size='24' text-anchor='middle' class='b'>Lunge</text><text x='528' y='180' font-size='15' text-anchor='middle'>atmet CO₂ aus</text><line x1='204.0' y1='160.0' x2='219.6' y2='160.0' stroke='#1F2A1C' stroke-width='4' stroke-linecap='round'/><polygon points='228.0,160.0 215.4,166.1 215.4,153.9' fill='#1F2A1C'/><line x1='412.0' y1='160.0' x2='427.6' y2='160.0' stroke='#1F2A1C' stroke-width='4' stroke-linecap='round'/><polygon points='436.0,160.0 423.4,166.1 423.4,153.9' fill='#1F2A1C'/><text x='320' y='262' font-size='24' text-anchor='middle' class='b'>HCO₃⁻ + H⁺  →  H₂CO₃  →  H₂O + CO₂</text><text x='320' y='292' font-size='17' text-anchor='middle' class='m'>Hydrogencarbonat fängt das Proton – als CO₂ verlässt es den Körper.</text><rect x='60' y='340' width='520' height='34' rx='6' fill='#DFE5D0'/><rect x='346.0' y='340' width='52.0' height='34' fill='#7FA83A'/><text x='60.0' y='398' font-size='17' text-anchor='middle' class='b'>6,8</text><text x='164.00000000000009' y='398' font-size='17' text-anchor='middle' class='b'>7,0</text><text x='268.00000000000017' y='398' font-size='17' text-anchor='middle' class='b'>7,2</text><text x='372.0000000000003' y='398' font-size='17' text-anchor='middle' class='b'>7,4</text><text x='475.9999999999999' y='398' font-size='17' text-anchor='middle' class='b'>7,6</text><text x='580.0' y='398' font-size='17' text-anchor='middle' class='b'>7,8</text><text x='372.0000000000003' y='332' font-size='17' text-anchor='middle' class='b' style='fill:#3B4A2F'>normal 7,35–7,45</text><line x1='231.6' y1='336' x2='231.6' y2='378' stroke='#C0392B' stroke-width='4'/><text x='231.60000000000002' y='424' font-size='16' text-anchor='middle' class='b' style='fill:#C0392B'>nach hartem Sprint: 7,13 (kurz, normal)</text><text x='112.00000000000028' y='360' font-size='15' text-anchor='middle' class='b' style='fill:#8C3B2E'>Azidose</text><text x='502.0000000000003' y='360' font-size='15' text-anchor='middle' class='b' style='fill:#2A5C8C'>Alkalose</text><rect x='24' y='446' width='592' height='58' rx='10' fill='#3B4A2F'/><text x='320' y='470' font-size='18' text-anchor='middle' class='b' style='fill:#FFFFFF'>Schneller atmen = mehr CO₂ raus = weniger Kohlensäure</text><text x='320' y='494' font-size='14' text-anchor='middle' style='fill:#E7EED8'>Studie: Radsportler, Plasma-pH 7,35 → 7,13 (Med Sci Sports Exerc 2023)</text></svg>