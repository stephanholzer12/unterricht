<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 720" width="440" height="720" role="img" aria-label="Protonenübergang: HCl gibt an Wasser ab, Wasser gibt an Ammoniak ab"><title>Protonenübergang: HCl gibt an Wasser ab, Wasser gibt an Ammoniak ab</title><style>text{font-family:'Source Sans 3','Carlito','Segoe UI',Arial,sans-serif;fill:#1F2A1C} .b{font-weight:700} .m{fill:#5E6652} @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width='440' height='720' rx='18' fill='#F2F3EE'/><text x='20' y='42' font-size='30' text-anchor='start' class='b'>Protonen-Pingpong</text><text x='20' y='74' font-size='20' text-anchor='start' class='m'>Die Säure gibt ab, die Base fängt.</text><text x='20' y='100' font-size='20' text-anchor='start' class='m'>Der rote Ball ist das Proton (H⁺).</text><text x='20' y='140' font-size='23' text-anchor='start' class='b' style='fill:#3B4A2F'>1   HCl + H₂O → Cl⁻ + H₃O⁺</text><circle cx='80' cy='230' r='30' fill='#6BAF4A' stroke='#1F2A1C' stroke-width='2'/><text x='80' y='238.64' font-size='24' text-anchor='middle' class='b' style='fill:#FFFFFF'>Cl</text><circle cx='293.6' cy='241.2' r='13.2' fill='#FFFFFF' stroke='#1F2A1C' stroke-width='2'/><text x='293.6' y='246.6' font-size='15' text-anchor='middle' class='b' style='fill:#1F2A1C'>H</text><circle cx='346.4' cy='241.2' r='13.2' fill='#FFFFFF' stroke='#1F2A1C' stroke-width='2'/><text x='346.4' y='246.6' font-size='15' text-anchor='middle' class='b' style='fill:#1F2A1C'>H</text><circle cx='320' cy='222' r='24.0' fill='#D9534F' stroke='#1F2A1C' stroke-width='2'/><text x='320' y='229.56' font-size='21' text-anchor='middle' class='b' style='fill:#FFFFFF'>O</text><g><circle cx='124' cy='230' r='15' fill='#C0392B' stroke='#1F2A1C' stroke-width='2'><animate attributeName='cx' values='124;124;320;320' keyTimes='0;0.25;0.6;1' dur='3.2s' repeatCount='indefinite'/><animate attributeName='cy' values='230;230;188;188' keyTimes='0;0.25;0.6;1' dur='3.2s' repeatCount='indefinite'/></circle></g><path d='M140 204 Q 230 154 304 182' fill='none' stroke='#C0392B' stroke-width='3' stroke-dasharray='8 7'/><text x='80' y='292' font-size='20' text-anchor='middle' class='b' style='fill:#C0392B'>Säure (gibt)</text><text x='320' y='292' font-size='20' text-anchor='middle' class='b' style='fill:#2A5C8C'>Base (fängt)</text><line x1='20' y1='335' x2='420' y2='335' stroke='#DFE5D0' stroke-width='3'/><text x='20' y='376' font-size='23' text-anchor='start' class='b' style='fill:#3B4A2F'>2   H₂O + NH₃ → OH⁻ + NH₄⁺</text><circle cx='62' cy='450' r='13' fill='#FFFFFF' stroke='#1F2A1C' stroke-width='2'/><text x='62' y='455.4' font-size='15' text-anchor='middle' class='b' style='fill:#1F2A1C'>H</text><circle cx='90' cy='432' r='24' fill='#D9534F' stroke='#1F2A1C' stroke-width='2'/><text x='90' y='439.56' font-size='21' text-anchor='middle' class='b' style='fill:#FFFFFF'>O</text><circle cx='320' cy='440' r='28' fill='#4A7BD0' stroke='#1F2A1C' stroke-width='2'/><text x='320' y='448.28' font-size='23' text-anchor='middle' class='b' style='fill:#FFFFFF'>N</text><circle cx='282' cy='466' r='13' fill='#FFFFFF' stroke='#1F2A1C' stroke-width='2'/><text x='282' y='471.4' font-size='15' text-anchor='middle' class='b' style='fill:#1F2A1C'>H</text><circle cx='358' cy='466' r='13' fill='#FFFFFF' stroke='#1F2A1C' stroke-width='2'/><text x='358' y='471.4' font-size='15' text-anchor='middle' class='b' style='fill:#1F2A1C'>H</text><circle cx='320' cy='482' r='13' fill='#FFFFFF' stroke='#1F2A1C' stroke-width='2'/><text x='320' y='487.4' font-size='15' text-anchor='middle' class='b' style='fill:#1F2A1C'>H</text><g><circle cx='118' cy='450' r='15' fill='#C0392B' stroke='#1F2A1C' stroke-width='2'><animate attributeName='cx' values='118;118;320;320' keyTimes='0;0.25;0.6;1' dur='3.2s' begin='0.4s' repeatCount='indefinite'/><animate attributeName='cy' values='450;450;398;398' keyTimes='0;0.25;0.6;1' dur='3.2s' begin='0.4s' repeatCount='indefinite'/></circle></g><text x='90' y='522' font-size='20' text-anchor='middle' class='b' style='fill:#C0392B'>Säure: Wasser!</text><text x='320' y='522' font-size='20' text-anchor='middle' class='b' style='fill:#2A5C8C'>Base: Ammoniak</text><text x='220' y='568' font-size='18' text-anchor='middle' class='m'>Nur ein kleiner Teil des Ammoniaks reagiert.</text><rect x='20' y='600' width='400' height='96' rx='12' fill='#3B4A2F'/><text x='220' y='642' font-size='23' text-anchor='middle' class='b' style='fill:#FFFFFF'>Wasser kann beides:</text><text x='220' y='671' font-size='23' text-anchor='middle' class='b' style='fill:#FFFFFF'>es ist ein Ampholyt.</text></svg>