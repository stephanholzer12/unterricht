<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" role="img" aria-label="Protonenübergang: HCl gibt an Wasser ab, Wasser gibt an Ammoniak ab"><title>Protonenübergang: HCl gibt an Wasser ab, Wasser gibt an Ammoniak ab</title><style>text{font-family:'Source Sans 3','Carlito','Segoe UI',Arial,sans-serif;fill:#1F2A1C} .b{font-weight:700} .m{fill:#5E6652} @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width='640' height='520' rx='18' fill='#F2F3EE'/><text x='24' y='44' font-size='28' text-anchor='start' class='b'>Protonen-Pingpong</text><text x='24' y='74' font-size='20' text-anchor='start' class='m'>Die Säure gibt ab, die Base fängt. Der rote Ball ist das Proton.</text><text x='24' y='112' font-size='22' text-anchor='start' class='b' style='fill:#3B4A2F'>1  HCl + H₂O → Cl⁻ + H₃O⁺</text><circle cx='90' cy='190' r='26' fill='#6BAF4A' stroke='#1F2A1C' stroke-width='2'/><text x='90' y='197.92' font-size='22' text-anchor='middle' class='b' style='fill:#FFFFFF'>Cl</text><circle cx='308.0' cy='198.0' r='11.0' fill='#FFFFFF' stroke='#1F2A1C' stroke-width='2'/><text x='308.0' y='202.68' font-size='13' text-anchor='middle' class='b' style='fill:#1F2A1C'>H</text><circle cx='352.0' cy='198.0' r='11.0' fill='#FFFFFF' stroke='#1F2A1C' stroke-width='2'/><text x='352.0' y='202.68' font-size='13' text-anchor='middle' class='b' style='fill:#1F2A1C'>H</text><circle cx='330' cy='182' r='20.0' fill='#D9534F' stroke='#1F2A1C' stroke-width='2'/><text x='330' y='188.48' font-size='18' text-anchor='middle' class='b' style='fill:#FFFFFF'>O</text><g><circle cx='128' cy='190' r='13' fill='#C0392B' stroke='#1F2A1C' stroke-width='2'><animate attributeName='cx' values='128;128;330;330' keyTimes='0;0.25;0.6;1' dur='3.2s' repeatCount='indefinite'/><animate attributeName='cy' values='190;190;156;156' keyTimes='0;0.25;0.6;1' dur='3.2s' repeatCount='indefinite'/></circle></g><text x='90' y='244' font-size='18' text-anchor='middle' class='b' style='fill:#C0392B'>Säure (gibt ab)</text><text x='330' y='244' font-size='18' text-anchor='middle' class='b' style='fill:#2A5C8C'>Base (fängt)</text><path d='M140 168 Q 230 120 316 150' fill='none' stroke='#C0392B' stroke-width='3' stroke-dasharray='8 7'/><text x='470' y='184' font-size='24' text-anchor='start' class='b'>→ Cl⁻</text><text x='470' y='216' font-size='24' text-anchor='start' class='b'>→ H₃O⁺</text><line x1='24' y1='262' x2='616' y2='262' stroke='#DFE5D0' stroke-width='3'/><text x='24' y='300' font-size='22' text-anchor='start' class='b' style='fill:#3B4A2F'>2  NH₃ + H₂O → NH₄⁺ + OH⁻</text><circle cx='88' cy='383' r='11' fill='#FFFFFF' stroke='#1F2A1C' stroke-width='2'/><text x='88' y='387.68' font-size='13' text-anchor='middle' class='b' style='fill:#1F2A1C'>H</text><circle cx='110' cy='367' r='20' fill='#D9534F' stroke='#1F2A1C' stroke-width='2'/><text x='110' y='373.48' font-size='18' text-anchor='middle' class='b' style='fill:#FFFFFF'>O</text><circle cx='330' cy='375' r='24' fill='#4A7BD0' stroke='#1F2A1C' stroke-width='2'/><text x='330' y='382.2' font-size='20' text-anchor='middle' class='b' style='fill:#FFFFFF'>N</text><circle cx='296' cy='397' r='11' fill='#FFFFFF' stroke='#1F2A1C' stroke-width='2'/><text x='296' y='401.68' font-size='13' text-anchor='middle' class='b' style='fill:#1F2A1C'>H</text><circle cx='364' cy='397' r='11' fill='#FFFFFF' stroke='#1F2A1C' stroke-width='2'/><text x='364' y='401.68' font-size='13' text-anchor='middle' class='b' style='fill:#1F2A1C'>H</text><circle cx='330' cy='411' r='11' fill='#FFFFFF' stroke='#1F2A1C' stroke-width='2'/><text x='330' y='415.68' font-size='13' text-anchor='middle' class='b' style='fill:#1F2A1C'>H</text><g><circle cx='132' cy='383' r='13' fill='#C0392B' stroke='#1F2A1C' stroke-width='2'><animate attributeName='cx' values='132;132;330;330' keyTimes='0;0.25;0.6;1' dur='3.2s' begin='0.4s' repeatCount='indefinite'/><animate attributeName='cy' values='383;383;341;341' keyTimes='0;0.25;0.6;1' dur='3.2s' begin='0.4s' repeatCount='indefinite'/></circle></g><text x='110' y='441' font-size='18' text-anchor='middle' class='b' style='fill:#C0392B'>Säure: Wasser!</text><text x='330' y='449' font-size='18' text-anchor='middle' class='b' style='fill:#2A5C8C'>Base: Ammoniak</text><text x='470' y='369' font-size='24' text-anchor='start' class='b'>→ OH⁻</text><text x='470' y='401' font-size='24' text-anchor='start' class='b'>→ NH₄⁺</text><rect x='24' y='470' width='592' height='38' rx='10' fill='#3B4A2F'/><text x='320' y='496' font-size='20' text-anchor='middle' class='b' style='fill:#FFFFFF'>Wasser kann beides – es ist ein Ampholyt.</text></svg>