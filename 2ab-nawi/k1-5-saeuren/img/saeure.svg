<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 720" width="440" height="720" role="img" aria-label="Animation: HCl trifft auf Wasser, das H-plus springt zum Wassermolekül, es entstehen Cl-minus und H3O-plus; darunter Säuren im Alltag"><title>Animation: HCl trifft auf Wasser, das H-plus springt zum Wassermolekül, es entstehen Cl-minus und H3O-plus; darunter Säuren im Alltag</title><style>text{font-family:'Source Sans 3','Carlito','Segoe UI',Arial,sans-serif;fill:#1F2A1C} .b{font-weight:700} .m{fill:#5E6652} @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width='440' height='720' rx='18' fill='#F2F3EE'/><text x='20' y='42' font-size='30' text-anchor='start' class='b'>Säure in Wasser</text><text x='20' y='74' font-size='20' text-anchor='start' class='m'>HCl gibt sein H⁺ an Wasser ab.</text><rect x='20' y='104' width='400' height='44' rx='12' fill='#FFFFFF' stroke='#DFE5D0' stroke-width='3'/><g><g opacity='0'><text x='220' y='133' font-size='21' text-anchor='middle' class='b'>1  HCl trifft auf Wasser.</text><animate attributeName='opacity' values='1;1;0;0;1;1' keyTimes='0.000;0.170;0.200;0.960;0.985;1.000' dur='12s' repeatCount='indefinite'/></g><g opacity='0'><text x='220' y='133' font-size='21' text-anchor='middle' class='b'>2  Das H⁺ springt zum Wasser.</text><animate attributeName='opacity' values='0;0;1;1;0;0;0;0' keyTimes='0.000;0.170;0.210;0.380;0.420;0.960;0.985;1.000' dur='12s' repeatCount='indefinite'/></g><g opacity='1'><text x='220' y='133' font-size='21' text-anchor='middle' class='b'>3  Es entsteht H₃O⁺: sauer!</text><animate attributeName='opacity' values='0;0;1;1;0;0' keyTimes='0.000;0.420;0.470;0.960;0.985;1.000' dur='12s' repeatCount='indefinite'/></g><g transform='translate(80 250)'><circle cx='0' cy='0' r='30' fill='#6BAF4A' stroke='#1F2A1C' stroke-width='2'/><text x='0' y='8.64' font-size='24' text-anchor='middle' class='b' style='fill:#FFFFFF'>Cl</text><g opacity='1'><text x='38' y='-26' font-size='32' text-anchor='middle' class='b' style='fill:#2A5C8C'>−</text><animate attributeName='opacity' values='0;0;1;1;0;0' keyTimes='0.000;0.400;0.470;0.960;0.985;1.000' dur='12s' repeatCount='indefinite'/></g><g opacity='0'><text x='21' y='66' font-size='24' text-anchor='middle' class='b'>HCl</text><animate attributeName='opacity' values='1;1;0;0;1;1' keyTimes='0.000;0.380;0.450;0.960;0.985;1.000' dur='12s' repeatCount='indefinite'/></g><g opacity='1'><text x='0' y='66' font-size='24' text-anchor='middle' class='b'>Cl⁻</text><animate attributeName='opacity' values='0;0;1;1;0;0' keyTimes='0.000;0.400;0.470;0.960;0.985;1.000' dur='12s' repeatCount='indefinite'/></g><g opacity='1'><text x='0' y='94' font-size='19' text-anchor='middle' class='m'>Säurerest</text><animate attributeName='opacity' values='0;0;1;1;0;0' keyTimes='0.000;0.520;0.600;0.960;0.985;1.000' dur='12s' repeatCount='indefinite'/></g><animateTransform attributeName='transform' type='translate' values='95 250;95 250;80 250;80 250;95 250;95 250' keyTimes='0.000;0.400;0.550;0.960;0.985;1.000' dur='12s' repeatCount='indefinite'/></g><g transform='translate(330 250)'><g opacity='0.16'><circle cx='0' cy='-8' r='64' fill='#C0392B'/><animate attributeName='opacity' values='0;0;0.16;0.08;0.16;0.16;0;0' keyTimes='0.000;0.580;0.680;0.800;0.920;0.960;0.985;1.000' dur='12s' repeatCount='indefinite'/></g><circle cx='-30' cy='17.5' r='13.75' fill='#FFFFFF' stroke='#1F2A1C' stroke-width='2'/><text x='-30' y='23.259999999999998' font-size='16' text-anchor='middle' class='b' style='fill:#1F2A1C'>H</text><circle cx='30' cy='17.5' r='13.75' fill='#FFFFFF' stroke='#1F2A1C' stroke-width='2'/><text x='30' y='23.259999999999998' font-size='16' text-anchor='middle' class='b' style='fill:#1F2A1C'>H</text><circle cx='0' cy='0' r='25' fill='#D9534F' stroke='#1F2A1C' stroke-width='2'/><text x='0' y='7.92' font-size='22' text-anchor='middle' class='b' style='fill:#FFFFFF'>O</text><g opacity='1'><text x='38' y='-34' font-size='32' text-anchor='