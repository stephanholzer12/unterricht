<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 640" width="440" height="640" role="img" aria-label="Farben des Rotkrautsafts von stark sauer rot bis stark basisch gelb"><title>Farben des Rotkrautsafts von stark sauer rot bis stark basisch gelb</title><style>text{font-family:'Source Sans 3','Carlito','Segoe UI',Arial,sans-serif;fill:#1F2A1C} .b{font-weight:700} .m{fill:#5E6652} </style><rect width='440' height='640' rx='18' fill='#F2F3EE'/><text x='20' y='42' font-size='30' text-anchor='start' class='b'>Rotkrautsaft als Indikator</text><text x='20' y='74' font-size='20' text-anchor='start' class='m'>Ungefähre Farben – jeder Saft</text><text x='20' y='100' font-size='20' text-anchor='start' class='m'>ist ein bisschen anders.</text><rect x='20' y='130' width='86' height='60' rx='12' fill='#C2185B' stroke='#1F2A1C' stroke-width='2'/><text x='124' y='157' font-size='22' text-anchor='start' class='b'>pH 1–2</text><text x='124' y='182' font-size='18' text-anchor='start' class='m'>stark sauer</text><text x='420' y='168' font-size='22' text-anchor='end' class='b'>rot</text><rect x='20' y='202' width='86' height='60' rx='12' fill='#C2508A' stroke='#1F2A1C' stroke-width='2'/><text x='124' y='229' font-size='22' text-anchor='start' class='b'>pH 3–4</text><text x='124' y='254' font-size='18' text-anchor='start' class='m'>sauer</text><text x='420' y='240' font-size='22' text-anchor='end' class='b'>rosa</text><rect x='20' y='274' width='86' height='60' rx='12' fill='#8A4C9E' stroke='#1F2A1C' stroke-width='2'/><text x='124' y='301' font-size='22' text-anchor='start' class='b'>pH 5–6</text><text x='124' y='326' font-size='18' text-anchor='start' class='m'>schwach sauer</text><text x='420' y='312' font-size='22' text-anchor='end' class='b'>rotviolett</text><rect x='20' y='346' width='86' height='60' rx='12' fill='#5C5BA8' stroke='#1F2A1C' stroke-width='2'/><text x='124' y='373' font-size='22' text-anchor='start' class='b'>pH 7</text><text x='124' y='398' font-size='18' text-anchor='start' class='m'>neutral</text><text x='420' y='384' font-size='22' text-anchor='end' class='b'>violett</text><rect x='20' y='418' width='86' height='60' rx='12' fill='#3F6FB5' stroke='#1F2A1C' stroke-width='2'/><text x='124' y='445' font-size='22' text-anchor='start' class='b'>pH 8–9</text><text x='124' y='470' font-size='18' text-anchor='start' class='m'>schwach basisch</text><text x='420' y='456' font-size='22' text-anchor='end' class='b'>blau</text><rect x='20' y='490' width='86' height='60' rx='12' fill='#3E9A6A' stroke='#1F2A1C' stroke-width='2'/><text x='124' y='517' font-size='22' text-anchor='start' class='b'>pH 10–12</text><text x='124' y='542' font-size='18' text-anchor='start' class='m'>basisch</text><text x='420' y='528' font-size='22' text-anchor='end' class='b'>grün</text><rect x='20' y='562' width='86' height='60' rx='12' fill='#D4C21A' stroke='#1F2A1C' stroke-width='2'/><text x='124' y='589' font-size='22' text-anchor='start' class='b'>pH 13–14</text><text x='124' y='614' font-size='18' text-anchor='start' class='m'>stark basisch</text><text x='420' y='600' font-size='22' text-anchor='end' class='b'>gelb</text></svg>