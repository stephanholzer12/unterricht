<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430" role="img" aria-label="Animation: Ein Schiff fährt von Asien nach Österreich, eine Tigermücke reist mit. Darunter: Tigermücke seit 2022 in allen Bundesländern, Drüsiges Springkraut verdrängt heimische Pflanzen."><title>Animation: Ein Schiff fährt von Asien nach Österreich, eine Tigermücke reist mit. Darunter: Tigermücke seit 2022 in allen Bundesländern, Drüsiges Springkraut verdrängt heimische Pflanzen.</title><style>text{font-family:'Source Sans 3','Carlito','Segoe UI',Arial,sans-serif;fill:#1F2A1C} .b{font-weight:700} .m{fill:#5E6652} @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width='640' height='430' rx='18' fill='#F2F3EE'/><text x='24' y='44' font-size='28' text-anchor='start' class='b'>Arten reisen mit</text><text x='24' y='74' font-size='19' text-anchor='start' class='m'>Globalisierung der Ökosysteme (Buch S. 41)</text><rect x='24' y='100' width='170' height='150' rx='14' fill='#E6EDF3' stroke='#2A5C8C' stroke-width='2'/><text x='109' y='135' font-size='24' text-anchor='middle' class='b'>Asien</text><rect x='446' y='100' width='170' height='150' rx='14' fill='#EEF3E4' stroke='#3B4A2F' stroke-width='2'/><text x='531' y='135' font-size='24' text-anchor='middle' class='b'>Österreich</text><path d='M194 200 C280 160 360 160 446 200' fill='none' stroke='#5E6652' stroke-width='3' stroke-dasharray='8 6'/><g><g transform='translate(440 196)'><path d='M-34 0 h68 l-12 16 h-44z' fill='#3B4A2F'/><rect x='-18' y='-16' width='30' height='16' fill='#D9772B'/><rect x='-30' y='-12' width='10' height='12' fill='#2E7D8C'/><animateTransform attributeName='transform' type='translate' values='200 196;200 196;440 196;440 196;200 196;200 196' keyTimes='0.000;0.100;0.600;0.960;0.985;1.000' dur='12s' repeatCount='indefinite'/></g><g transform='translate(500 215)'><ellipse cx='0' cy='0' rx='14' ry='5' fill='#1F2A1C'/><path d='M-4 -2 l-10 -14 M4 -2 l10 -14' stroke='#5E6652' stroke-width='2'/><path d='M-8 3 h4 M0 3 h4 M8 3 h4' stroke='#fff' stroke-width='2'/><animateTransform attributeName='transform' type='translate' values='200 176;200 176;500 215;500 215;500 215;200 176;200 176' keyTimes='0.000;0.100;0.600;0.620;0.960;0.985;1.000' dur='12s' repeatCount='indefinite'/></g><g opacity='1'><text x='24' y='290' font-size='20' text-anchor='start' class='b'>Mit Waren und Reisenden kommen fremde Arten mit.</text><animate attributeName='opacity' values='0;0;1;1;0;0' keyTimes='0.000;0.100;0.120;0.960;0.985;1.000' dur='12s' repeatCount='indefinite'/></g><g opacity='1'><text x='24' y='330' font-size='18' text-anchor='start'>Tigermücke (Neozoon): seit 2022 in allen Bundesländern</text><text x='24' y='360' font-size='18' text-anchor='start'>Drüsiges Springkraut (Neophyt): verdrängt heimische Pflanzen</text><text x='24' y='390' font-size='18' text-anchor='start' class='b'>Folge: Ökosysteme werden weltweit ähnlicher –</text><text x='24' y='412' font-size='18' text-anchor='start' class='b'>und Krankheitserreger reisen schneller.</text><animate attributeName='opacity' values='0;0;1;1;0;0' keyTimes='0.000;0.620;0.660;0.960;0.985;1.000' dur='12s' repeatCount='indefinite'/></g><animate attributeName='opacity' values='1;1;0;0;1' keyTimes='0;0.920;0.96;0.985;1' dur='12s' repeatCount='indefinite'/></g></svg>