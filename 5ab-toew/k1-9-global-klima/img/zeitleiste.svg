<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" role="img" aria-label="Zeitleiste: 1992 Rio Klimarahmenkonvention (erste COP 1995 Berlin), 1997 Kyoto, 2015 Paris (deutlich unter 2 Grad, möglichst 1,5), 2023 Dubai (Abkehr von fossilen Energien), 2026 Antalya COP31 ohne Abschlusspapier."><title>Zeitleiste: 1992 Rio Klimarahmenkonvention (erste COP 1995 Berlin), 1997 Kyoto, 2015 Paris (deutlich unter 2 Grad, möglichst 1,5), 2023 Dubai (Abkehr von fossilen Energien), 2026 Antalya COP31 ohne Abschlusspapier.</title><style>text{font-family:'Source Sans 3','Carlito','Segoe UI',Arial,sans-serif;fill:#1F2A1C} .b{font-weight:700} .m{fill:#5E6652} </style><rect width='640' height='500' rx='18' fill='#F2F3EE'/><text x='24' y='44' font-size='28' text-anchor='start' class='b'>Klimakonferenzen: ein langer Weg</text><text x='24' y='74' font-size='19' text-anchor='start' class='m'>Buch S. 73–74 · ergänzt bis 2026</text><line x1='70' y1='100' x2='70' y2='470' stroke='#3B4A2F' stroke-width='5'/><circle cx='70' cy='125' r='14' fill='#7FA83A'/><text x='100' y='121' font-size='24' text-anchor='start' class='b'>1992</text><text x='100' y='149' font-size='18' text-anchor='start'>Rio: Klimarahmenkonvention – erste COP 1995 in Berlin</text><circle cx='70' cy='197' r='14' fill='#7FA83A'/><text x='100' y='193' font-size='24' text-anchor='start' class='b'>1997</text><text x='100' y='221' font-size='18' text-anchor='start'>Kyoto-Protokoll: erste Reduktionsziele für Industriestaaten</text><circle cx='70' cy='269' r='14' fill='#7FA83A'/><text x='100' y='265' font-size='24' text-anchor='start' class='b'>2015</text><text x='100' y='293' font-size='18' text-anchor='start'>Paris: Erwärmung deutlich unter 2 °C, möglichst 1,5 °C</text><circle cx='70' cy='341' r='14' fill='#7FA83A'/><text x='100' y='337' font-size='24' text-anchor='start' class='b'>2023</text><text x='100' y='365' font-size='18' text-anchor='start'>Dubai: Abkehr von fossilen Energien beschlossen</text><circle cx='70' cy='413' r='14' fill='#A33A2B'/><text x='100' y='409' font-size='24' text-anchor='start' class='b'>2026</text><text x='100' y='437' font-size='18' text-anchor='start'>Antalya (COP31): kein gemeinsames Abschlusspapier</text><path d='M62 405 l16 16 M78 405 l-16 16' stroke='#fff' stroke-width='4'/></svg>