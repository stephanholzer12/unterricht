<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" role="img" aria-label="Animation: Fünf Stationen eines Handys – Bergbau, Fabrik, Transport, Nutzung, Entsorgung – füllen nacheinander einen Rucksack. Am Ende wiegt er rund 75 kg, das Handy nur 0,1 kg."><title>Animation: Fünf Stationen eines Handys – Bergbau, Fabrik, Transport, Nutzung, Entsorgung – füllen nacheinander einen Rucksack. Am Ende wiegt er rund 75 kg, das Handy nur 0,1 kg.</title><style>text{font-family:'Source Sans 3','Carlito','Segoe UI',Arial,sans-serif;fill:#1F2A1C} .b{font-weight:700} .m{fill:#5E6652} @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width='640' height='520' rx='18' fill='#F2F3EE'/><text x='24' y='44' font-size='28' text-anchor='start' class='b'>Der ökologische Rucksack eines Handys</text><text x='24' y='74' font-size='19' text-anchor='start' class='m'>Alles, was für ein Handy bewegt und verbraucht wird – in Kilogramm</text><path d='M380 200 q90 -50 180 0 v230 q0 30 -30 30 h-120 q-30 0 -30 -30z' fill='#fff' stroke='#3B4A2F' stroke-width='4'/><path d='M430 190 q40 -40 80 0' fill='none' stroke='#3B4A2F' stroke-width='6'/><rect x='560' y='92' width='44' height='76' rx='8' fill='#1F2A1C'/><rect x='565' y='100' width='34' height='56' rx='3' fill='#2E7D8C'/><text x='582' y='188' font-size='20' text-anchor='middle' class='b'>0,1 kg</text><text x='24' y='505' font-size='19' text-anchor='start' class='m'>Verhältnis: 75 kg : 0,1 kg = 750-mal so schwer wie das Handy selbst</text><g><g opacity='1'><rect x='24' y='120' width='250' height='58' rx='10' fill='#fff' stroke='#3B4A2F' stroke-width='2'/><text x='40' y='146' font-size='22' text-anchor='start' class='b'>1  Bergbau</text><text x='40' y='170' font-size='18' text-anchor='start' class='m'>Erz, Gestein</text><animate attributeName='opacity' values='0;0;1;1;0;0' keyTimes='0.000;0.080;0.110;0.960;0.985;1.000' dur='12s' repeatCount='indefinite'/></g><g opacity='0'><g transform='t