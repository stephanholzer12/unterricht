<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" role="img" aria-label="Überblick als Kette: Konsum, Abdruck, Rechenzentren, Klima, Abkommen."><title>Überblick als Kette: Konsum, Abdruck, Rechenzentren, Klima, Abkommen.</title><style>text{font-family:'Source Sans 3','Carlito','Segoe UI',Arial,sans-serif;fill:#1F2A1C} .b{font-weight:700} .m{fill:#5E6652} </style><rect width='640' height='470' rx='18' fill='#F2F3EE'/><text x='24' y='44' font-size='26' text-anchor='start' class='b'>Ein Planet reicht nicht – der rote Faden</text><rect x='40' y='70' width='560' height='62' rx='12' fill='#fff' stroke='#3B4A2F' stroke-width='2'/><text x='60' y='100' font-size='24' text-anchor='start' class='b'>Konsum</text><text x='60' y='124' font-size='18' text-anchor='start' class='m'>Essen, Handy, Fahrten</text><line x1='320.0' y1='132.0' x2='320.0' y2='142.0' stroke='#3B4A2F' stroke-width='3' stroke-linecap='round'/><polygon points='320.0,148.0 315.7,139.0 324.3,139.0' fill='#3B4A2F'/><rect x='40' y='148' width='560' height='62' rx='12' fill='#fff' stroke='#3B4A2F' stroke-width='2'/><text x='60' y='178' font-size='24' text-anchor='start' class='b'>Abdruck</text><text x='60' y='202' font-size='18' text-anchor='start' class='m'>Fläche · Rucksack · CO₂</text><line x1='320.0' y1='210.0' x2='320.0' y2='220.0' stroke='#3B4A2F' stroke-width='3' stroke-linecap='round'/><polygon points='320.0,226.0 315.7,217.0 324.3,217.0' fill='#3B4A2F'/><rect x='40' y='226' width='560' height='62' rx='12' fill='#fff' stroke='#3B4A2F' stroke-width='2'/><text x='60' y='256' font-size='24' text-anchor='start' class='b'>Rechenzentren</text><text x='60' y='280' font-size='18' text-anchor='start' class='m'>auch KI braucht Strom und Wasser</text><line x1='320.0' y1='288.0' x2='320.0' y2='298.0' stroke='#3B4A2F' stroke-width='3' stroke-linecap='round'/><polygon points='320.0,304.0 315.7,295.0 324.3,295.0' fill='#3B4A2F'/><rect x='40' y='304' width='560' height='62' rx='12' fill=