<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" role="img" aria-label="Animation: Sonnenlicht kommt durch die Atmosphäre zum Boden. Der warme Boden strahlt Wärme ab; ein Teil entweicht ins All, ein Teil wird von Treibhausgasen zurückgehalten. Mehr CO₂ heißt mehr zurückgehaltene Wärme."><title>Animation: Sonnenlicht kommt durch die Atmosphäre zum Boden. Der warme Boden strahlt Wärme ab; ein Teil entweicht ins All, ein Teil wird von Treibhausgasen zurückgehalten. Mehr CO₂ heißt mehr zurückgehaltene Wärme.</title><style>text{font-family:'Source Sans 3','Carlito','Segoe UI',Arial,sans-serif;fill:#1F2A1C} .b{font-weight:700} .m{fill:#5E6652} @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width='640' height='520' rx='18' fill='#F2F3EE'/><text x='24' y='44' font-size='28' text-anchor='start' class='b'>Der Treibhauseffekt</text><text x='24' y='74' font-size='19' text-anchor='start' class='m'>Buch S. 71 – vereinfacht</text><circle cx='80' cy='130' r='34' fill='#F2C14E'/><rect x='0' y='170' width='640' height='120' fill='#DCE8EE' opacity='.8'/><text x='616' y='200' font-size='18' text-anchor='end' class='m'>Atmosphäre</text><g><circle cx='220' cy='230' r='9' fill='#5E6652'/><circle cx='206' cy='230' r='7' fill='#A33A2B'/><circle cx='234' cy='230' r='7' fill='#A33A2B'/></g><g><circle cx='300' cy='205' r='9' fill='#5E6652'/><circle cx='286' cy='205' r='7' fill='#A33A2B'/><circle cx='314' cy='205' r='7' fill='#A33A2B'/></g><g><circle cx='380' cy='250' r='9' fill='#5E6652'/><circle cx='366' cy='250' r='7' fill='#A33A2B'/><circle cx='394' cy='250' r='7' fill='#A33A2B'/></g><g><circle cx='460' cy='215' r='9' fill='#5E6652'/><circle cx='446' cy='215' r='7' fill='#A33A2B'/><circle cx='474' cy='215' r='7' fill='#A33A2B'/></g><g><circle cx='540' cy='245' r='9' fill='#5E6652'/><circle cx='526' cy='245' r='7' fill='#A33A2B'/><circle cx='554' cy='245' r='7' fill='#A33A2B'/></g><text x='24' y='270' font-size='18' text-anchor='start' class='b'>Treibhausgase (CO₂ …)</text><path d='M0 400 Q160 380 320 400 T640 395 V520 H0z' fill='#7FA83A' opacity='.55'/><text x='24' y='500' font-size='20' text-anchor='start' class='b'>Erdboden</text><g><g transform='translate(300 390)'><path d='M0 0 l18 0 m-9 -9 l9 9 l-9 9' stroke='#E0A800' stroke-width='5' fill='none'/><animateTransform attributeName='transform' type='translate' values='110 150;110 150;300 390;300 390;300 390;110 150;110 150' keyTimes='0.000;0.020;0.220;0.230;0.960;0.985;1.000' dur='12s' repeatCount='indefinite'/></g><g opacity='0'><text x='24' y='340' font-size='20' text-anchor='start' class='b'>1  Sonnenlicht kommt durch die Luft bis zum Boden</text><animate attributeName='opacity' values='0;0;1;1;0;0;0;0' keyTimes='0.000;0.020;0.040;0.250;0.270;0.960;0.985;1.000' dur='12s' repeatCount='indefinite'/></g><g transform='translate(520 110)'><circle r='9' fill='#A33A2B'/><animateTransform attributeName='transform' type='translate' values='320 390;320 390;420 240;520 110;520 110;520 110;320 390;320 390' keyTimes='0.000;0.270;0.450;0.500;0.510;0.960;0.985;1.000' dur='12s' repeatCount='indefinite'/></g><g opacity='0'><text x='24' y='340' font-size='20' text-anchor='start' class='b'>2  Der warme Boden strahlt Wärme ab – ein Teil entweicht ins All</text><animate attributeName='opacity' values='0;0;1;1;0;0;0;0' keyTimes='0.000;0.250;0.270;0.520;0.540;0.960;0.985;1.000' dur='12s' repeatCount='indefinite'/></g><g transform='translate(300 390)'><circle r='9' fill='#A33A2B'/><animateTransform attributeName='transform' type='translate' values='330 390;330 390;380 250;300 390;300 390;300 390;330 390;330 390' keyTimes='0.000;0.530;0.660;0.800;0.810;0.960;0.985;1.000' dur='12s' repeatCount='indefinite'/></g><g opacity='1'><text x='24' y='340' font-size='20' text-anchor='start' class='b'>3  Treibhausgase halten einen Teil zurück – der Boden bleibt wärmer</text><animate attributeName='opacity' values='0;0;1;1;0;0' keyTimes='0.000;0.520;0.540;0.960;0.985;1.000' dur='12s' repeatCount='indefinite'/></g><g opacity='1'><text x='24' y='370' font-size='19' text-anchor='start' class='b' fill='#A33A2B'>Mehr CO₂ aus Kohle, Öl und Gas → mehr Wärme bleibt da → Erwärmung</text><animate attributeName='opacity' values='0;0;1;1;0;0' keyTimes='0.000;0.820;0.850;0.960;0.985;1.000' dur='12s' repeatCount='indefinite'/></g><animate attributeName='opacity' values='1;1;0;0;1' keyTimes='0;0.920;0.96;0.985;1' dur='12s' repeatCount='indefinite'/></g></svg>