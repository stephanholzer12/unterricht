<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 640" width="440" height="640" role="img" aria-label="Animation: Land A erhebt Zölle gegen Land B. Land B klagt bei der WTO, ein Schiedsgremium gibt B recht. Land A geht in Berufung, doch die Berufungsinstanz hat seit Ende 2019 keine Richter. Das Urteil wird nicht verbindlich."><title>Animation: Land A erhebt Zölle gegen Land B. Land B klagt bei der WTO, ein Schiedsgremium gibt B recht. Land A geht in Berufung, doch die Berufungsinstanz hat seit Ende 2019 keine Richter. Das Urteil wird nicht verbindlich.</title><style>text{font-family:'Source Sans 3', Carlito, 'Segoe UI', Arial, sans-serif;fill:#1F2A1C} .b{font-weight:700} .w{fill:#fff} .m{fill:#5E6652}</style><rect width='440' height='640' rx='18' fill='#F2F3EE'/><text x="220.0" y="40" font-size="24" text-anchor="middle" class="b">So läuft ein Handelsstreit</text><rect x="24" y="70" width="160" height="70" rx="14" fill="#FFFFFF" stroke="#3B4A2F" stroke-width="3"/><text x="104" y="113" font-size="22" text-anchor="middle" class="b">Land A</text><rect x="256" y="70" width="160" height="70" rx="14" fill="#FFFFFF" stroke="#3B4A2F" stroke-width="3"/><text x="336" y="113" font-size="22" text-anchor="middle" class="b">Land B</text><g><line x1="186" y1="105" x2="244.0" y2="105.0" stroke="#A33A2B" stroke-width="5" stroke-linecap="round"/><polygon points="252.0,105.0 239.4,111.1 239.4,98.9" fill="#A33A2B"/><text x="220" y="92" font-size="18" text-anchor="middle" class="b" style="fill:#A33A2B">Zoll</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0250;0.0667;0.9500;0.9833;1" dur="12.0s" repeatCount="indefinite"/></g><g><line x1="336" y1="144" x2="303.8" y2="203.0" stroke="#2E7D8C" stroke-width="5" stroke-linecap="round"/><polygon points="300.0,210.0 300.7,196.0 311.4,201.8" fill="#2E7D8C"/><rect x="110" y="214" width="220" height="80" rx="14" fill="#2E7D8C"/><text x="220" y="248" font-size="21" text-anchor="middle" class="b w">Schiedsgremium</text><text x="220" y="276" font-size="18" text-anchor="middle" class="w">der WTO</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2500;0.2917;0.9500;0.9833;1" dur="12.0s" repeatCount="indefinite"/></g><g><text x="220" y="326" font-size="20" text-anchor="middle" class="b" style="fill:#2E7D8C">Urteil: Land B hat recht.</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3583;0.4000;0.9500;0.9833;1" dur="12.0s" repeatCount="indefinite"/></g><g><line x1="104" y1="144" x2="119.5" y2="372.0" stroke="#3B4A2F" stroke-width="5" stroke-linecap="round"/><polygon points="120.0,380.0 113.1,367.8 125.2,367.0" fill="#3B4A2F"/><rect x="80" y="384" width="280" height="92" rx="14" fill="#FFFFFF" stroke="#A33A2B" stroke-width="3" stroke-dasharray="9 7"/><text x="220" y="420" font-size="21" text-anchor="middle" class="b" style="fill:#A33A2B">Berufungsinstanz</text><text x="220" y="452" font-size="19" text-anchor="middle" class="" style="fill:#A33A2B">0 Richter seit Ende 2019</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5000;0.5417;0.9500;0.9833;1" dur="12.0s" repeatCount="indefinite"/></g><g><line x1="300" y1="396" x2="346" y2="464" stroke="#A33A2B" stroke-width="7" stroke-linecap="round"/><line x1="346" y1="396" x2="300" y2="464" stroke="#A33A2B" stroke-width="7" stroke-linecap="round"/><text x="220" y="510" font-size="20" text-anchor="middle" class="b" style="fill:#A33A2B">Das Urteil wird nicht verbindlich.</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7500;0.7917;0.9500;0.9833;1" dur="12.0s" repeatCount="indefinite"/></g><g opacity="0"><rect x="16" y="566" width="408" height="44" rx="10" fill="#3B4A2F"/><text x="220.0" y="596" font-size="20" text-anchor="middle" class="b w">1 Land A erhebt Zölle, B klagt</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0250;0.0583;0.2333;0.2583;1" dur="12.0s" repeatCount="indefinite"/></g><g opacity="0"><rect x="16" y="566" width="408" height="44" rx="10" fill="#3B4A2F"/><text x="220.0" y="596" font-size="20" text-anchor="middle" class="b w">2 Die WTO-Schiedsstelle urteilt</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2500;0.2833;0.4833;0.5083;1" dur="12.0s" repeatCount="indefinite"/></g><g opacity="0"><rect x="16" y="566" width="408" height="44" rx="10" fill="#3B4A2F"/><text x="220.0" y="596" font-size="20" text-anchor="middle" class="b w">3 Land A geht in Berufung …</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5000;0.5333;0.7333;0.7583;1" dur="12.0s" repeatCount="indefinite"/></g><g opacity="1"><rect x="16" y="566" width="408" height="44" rx="10" fill="#3B4A2F"/><text x="220.0" y="596" font-size="20" text-anchor="middle" class="b w">4 … und dort sitzt niemand</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7500;0.7833;0.9500;0.9750;1" dur="12.0s" repeatCount="indefinite"/></g></svg>