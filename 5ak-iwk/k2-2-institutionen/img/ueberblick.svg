<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Drei Säulen: WTO in Genf mit 166 Mitgliedern für Regeln im Handel; Weltbank in Washington mit 189 Mitgliedern für langfristige Projektkredite; IWF in Washington mit 191 Mitgliedern für kurzfristige Kredite bei Zahlungskrisen, meist mit Auflagen."><title>Drei Säulen: WTO in Genf mit 166 Mitgliedern für Regeln im Handel; Weltbank in Washington mit 189 Mitgliedern für langfristige Projektkredite; IWF in Washington mit 191 Mitgliedern für kurzfristige Kredite bei Zahlungskrisen, meist mit Auflagen.</title><style>text{font-family:'Source Sans 3', Carlito, 'Segoe UI', Arial, sans-serif;fill:#1F2A1C} .b{font-weight:700} .w{fill:#fff} .m{fill:#5E6652}</style><rect width='900' height='470' rx='18' fill='#F2F3EE'/><text x="450.0" y="40" font-size="26" text-anchor="middle" class="b">Drei Institutionen – drei Aufgaben</text><rect x="30" y="64" width="270" height="380" rx="14" fill="#FFFFFF" stroke="#2E7D8C" stroke-width="3"/><rect x="30" y="64" width="270" height="92" rx="14" fill="#2E7D8C"/><text x="165" y="104" font-size="32" text-anchor="middle" class="b w">WTO</text><text x="165" y="136" font-size="17" text-anchor="middle" class="w">Welthandelsorganisation</text><text x="165" y="184" font-size="18" text-anchor="middle" class="b" style="fill:#2E7D8C">Genf · 166 Mitglieder</text><text x="165" y="228" font-size="20" text-anchor="middle" class="">Regeln für den Handel</text><text x="165" y="258" font-size="20" text-anchor="middle" class="">Zölle, Dienstleistungen,</text><text x="165" y="288" font-size="20" text-anchor="middle" class="">Patente</text><text x="165" y="318" font-size="20" text-anchor="middle" class="">Streit schlichten</text><rect x="65" y="376" width="200" height="46" rx="23" fill="#2E7D8C"/><text x="165" y="407" font-size="20" text-anchor="middle" class="b w">HANDEL</text><rect x="315" y="64" width="270" height="380" rx="14" fill="#FFFFFF" stroke="#3B4A2