<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 640" width="440" height="640" role="img" aria-label="Animation: Ein Staat mit leerer Kasse bittet den IWF um Hilfe. Der IWF stellt Auflagen, zum Beispiel bei der Ukraine 2026: mehr Steuern eintreiben, Korruption bekämpfen, Wechselkurs flexibler. Die erste Tranche von 1,5 Milliarden Dollar fließt. Nach bestandener Prüfung kommt die nächste Tranche."><title>Animation: Ein Staat mit leerer Kasse bittet den IWF um Hilfe. Der IWF stellt Auflagen, zum Beispiel bei der Ukraine 2026: mehr Steuern eintreiben, Korruption bekämpfen, Wechselkurs flexibler. Die erste Tranche von 1,5 Milliarden Dollar fließt. Nach bestandener Prüfung kommt die nächste Tranche.</title><style>text{font-family:'Source Sans 3', Carlito, 'Segoe UI', Arial, sans-serif;fill:#1F2A1C} .b{font-weight:700} .w{fill:#fff} .m{fill:#5E6652}</style><rect width='440' height='640' rx='18' fill='#F2F3EE'/><text x="220.0" y="40" font-size="24" text-anchor="middle" class="b">So läuft ein IWF-Kredit</text><rect x="24" y="70" width="170" height="96" rx="14" fill="#FFFFFF" stroke="#3B4A2F" stroke-width="3"/><text x="109" y="108" font-size="24" text-anchor="middle" class="b">Staat</text><text x="109" y="140" font-size="19" text-anchor="middle" class="" style="fill:#A33A2B">Kasse leer</text><rect x="246" y="70" width="170" height="96" rx="14" fill="#D9772B"/><text x="331" y="112" font-size="28" text-anchor="middle" class="b w">IWF</text><text x="331" y="144" font-size="18" text-anchor="middle" class="w">Washington</text><g><line x1="196" y1="104" x2="234.0" y2="104.0" stroke="#3B4A2F" stroke-width="5" stroke-linecap="round"/><polygon points="242.0,104.0 229.4,110.1 229.4,97.9" fill="#3B4A2F"/><text x="219" y="92" font-size="16" text-anchor="middle" class="b">Hilfe?</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0250;0.0667;0.9500;0.9833;1" dur="12.0s" repeatCount="indefinite"/></g><g><rect x="40" y="196" width="360" height="150" rx="14" fill="#FFFFFF" stroke="#D9772B" stroke-width="3"/><text x="220" y="228" font-size="20" text-anchor="middle" class="b" style="fill:#D9772B">Auflagen, z. B. Ukraine 2026:</text><text x="220" y="262" font-size="20" text-anchor="middle" class="">mehr Steuern eintreiben</text><text x="220" y="292" font-size="20" text-anchor="middle" class="">Korruption bekämpfen</text><text x="220" y="322" font-size="20" text-anchor="middle" class="">Wechselkurs flexibler</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2333;0.2750;0.9500;0.9833;1" dur="12.0s" repeatCount="indefinite"/></g><g><g><g transform="translate(110 420)"><circle cx="0" cy="0" r="34" fill="#7FA83A" stroke="#3B4A2F" stroke-width="3"/><text x="0" y="-2" font-size="20" text-anchor="middle" class="b w">1,5</text><text x="0" y="18" font-size="13" text-anchor="middle" class="w">Mrd. $</text></g><animateTransform attributeName="transform" type="translate" values="220 0;220 0;0 0;0 0" keyTimes="0;0.4667;0.5667;1" dur="12.0s" repeatCount="indefinite"/></g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4667;0.5083;0.9500;0.9833;1" dur="12.0s" repeatCount="indefinite"/></g><g><text x="300" y="427" font-size="20" text-anchor="middle" class="b" style="fill:#7FA83A">1. Tranche</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4667;0.5083;0.9500;0.9833;1" dur="12.0s" repeatCount="indefinite"/></g><g><rect x="40" y="476" width="360" height="56" rx="14" fill="#FFFFFF" stroke="#7FA83A" stroke-width="3"/><text x="220" y="512" font-size="19" text-anchor="middle" class="b" style="fill:#3B4A2F">Prüfung bestanden → nächste Tranche</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7167;0.7583;0.9500;0.9833;1" dur="12.0s" repeatCount="indefinite"/></g><g opacity="0"><rect x="16" y="566" width="408" height="44" rx="10" fill="#3B4A2F"/><text x="220.0" y="596" font-size="20" text-anchor="middle" class="b w">1 Ein Staat steckt in der Krise</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0250;0.0583;0.2167;0.2417;1" dur="12.0s" repeatCount="indefinite"/></g><g opacity="0"><rect x="16" y="566" width="408" height="44" rx="10" fill="#3B4A2F"/><text x="220.0" y="596" font-size="20" text-anchor="middle" class="b w">2 Der IWF stellt Bedingungen</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2333;0.2667;0.4500;0.4750;1" dur="12.0s" repeatCount="indefinite"/></g><g opacity="0"><rect x="16" y="566" width="408" height="44" rx="10" fill="#3B4A2F"/><text x="220.0" y="596" font-size="20" text-anchor="middle" class="b w">3 Das Geld kommt in Stücken</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4667;0.5000;0.7000;0.7250;1" dur="12.0s" repeatCount="indefinite"/></g><g opacity="1"><rect x="16" y="566" width="408" height="44" rx="10" fill="#3B4A2F"/><text x="220.0" y="596" font-size="20" text-anchor="middle" class="b w">4 Erst prüfen, dann weiter</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7167;0.7500;0.9500;0.9750;1" dur="12.0s" repeatCount="indefinite"/></g></svg>