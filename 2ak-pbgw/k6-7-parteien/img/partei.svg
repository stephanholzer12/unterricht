<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 560" width="440" height="560" role="img" aria-label="Vier Aufgaben einer Partei und fünf Geldquellen; Gründung mit Satzung beim Innenministerium; Klub ab 5 Abgeordneten"><title>Vier Aufgaben einer Partei und fünf Geldquellen; Gründung mit Satzung beim Innenministerium; Klub ab 5 Abgeordneten</title><style>text{font-family:'Source Sans 3','Carlito','Segoe UI',Arial,sans-serif;fill:#1F2A1C} .b{font-weight:700} .m{fill:#5E6652}</style><rect width='440' height='560' rx='18' fill='#F2F3EE'/><text x='20' y='42' font-size='28' text-anchor='start' class='b'>Was Parteien tun</text><text x='20' y='70' font-size='18' text-anchor='start' class='m'>und woher ihr Geld kommt – Buch S. 31</text><rect x='20' y='90' width='195' height='280' rx='12' fill='#FFFFFF' stroke='#3B4A2F' stroke-width='2'/><text x='117' y='120' font-size='21' text-anchor='middle' class='b'>Aufgaben</text><circle cx='42' cy='150' r='13' fill='#3B4A2F'/><text x='42' y='156' font-size='16' text-anchor='middle' class='b' style='fill:#FFFFFF'>1</text><text x='62' y='146' font-size='16' text-anchor='start'>Macht im</text><text x='62' y='165' font-size='16' text-anchor='start'>Staat übernehmen</text><circle cx='42' cy='206' r='13' fill='#3B4A2F'/><text x='42' y='212' font-size='16' text-anchor='middle' class='b' style='fill:#FFFFFF'>2</text><text x='62' y='202' font-size='16' text-anchor='start'>Programm</text><text x='62' y='221' font-size='16' text-anchor='start'>umsetzen</text><circle cx='42' cy='262' r='13' fill='#3B4A2F'/><text x='42' y='268' font-size='16' text-anchor='middle' class='b' style='fill:#FFFFFF'>3</text><text x='62' y='258' font-size='16' text-anchor='start'>Leute für</text><text x='62' y='277' font-size='16' text-anchor='start'>Ämter heranbilden</text><circle cx='42' cy='318' r='13' fill='#3B4A2F'/><text x='42' y='324' font-size='16' text-anchor='middle' class='b' style='fill:#FFFFFF'>4</text><text x='62' y='314' font-size='16' text-anchor='start'>für Politik</text><text x='62' y='333' font-size='16' text-anchor='start'>begeistern</text><rect x='225' y='90' width='195' height='280' rx='12' fill='#FFFFFF' stroke='#D9772B' stroke-width='2'/><text x='322' y='120' font-size='21' text-anchor='middle' class='b'>Geld</text><circle cx='246' cy='146' r='10' fill='#D9772B'/><text x='246' y='151' font-size='14' text-anchor='middle' class='b' style='fill:#FFFFFF'>€</text><text x='263' y='152' font-size='16' text-anchor='start'>Mitgliedsbeiträge</text><circle cx='246' cy='190' r='10' fill='#D9772B'/><text x='246' y='195' font-size='14' text-anchor='middle' class='b' style='fill:#FFFFFF'>€</text><text x='263' y='196' font-size='16' text-anchor='start'>Förderung vom Staat</text><circle cx='246' cy='234' r='10' fill='#D9772B'/><text x='246' y='239' font-size='14' text-anchor='middle' class='b' style='fill:#FFFFFF'>€</text><text x='263' y='240' font-size='16' text-anchor='start'>Klubförderung (ab 5)</text><circle cx='246' cy='278' r='10' fill='#D9772B'/><text x='246' y='283' font-size='14' text-anchor='middle' class='b' style='fill:#FFFFFF'>€</text><text x='263' y='284' font-size='16' text-anchor='start'>Spenden</text><circle cx='246' cy='322' r='10' fill='#D9772B'/><text x='246' y='327' font-size='14' text-anchor='middle' class='b' style='fill:#FFFFFF'>€</text><text x='263' y='328' font-size='16' text-anchor='start'>Abgeordnete zahlen mit</text><rect x='20' y='390' width='400' height='120' rx='12' fill='#EEF1E6'/><text x='220' y='422' font-size='18' text-anchor='middle'>Gründen: Satzung beim Innenministerium</text><text x='220' y='444' font-size='18' text-anchor='middle'>Im Nationalrat: ab 5 Abgeordneten ein Klub</text><text x='220' y='465' font-size='18' text-anchor='middle'>Staatsgeld soll unabhängig von Spendern machen</text></svg>