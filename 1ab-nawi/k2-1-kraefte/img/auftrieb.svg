<svg xmlns="http://www.w3.org/2000/svg" class="k21a" viewBox="0 0 440 652" width="440" height="652" role="img" aria-label="Auftrieb – animiert"><title>Auftrieb – animiert</title><style>.k21a text{font-family:'Source Sans 3','Carlito','Segoe UI',Arial,sans-serif;fill:#1F2A1C} .k21a .b{font-weight:700} .k21a .m{fill:#5E6652}</style><rect width='440' height='652' rx='18' fill='#F2F3EE'/><text x='20.0' y='40.0' font-size='30' text-anchor='start' class='b'>Auftrieb</text><text x='20.0' y='70.0' font-size='20' text-anchor='start' class='m'>Ein Holzball wird unter Wasser losgelassen.</text><rect x='20' y='86' width='400' height='46' rx='12' fill='#FFFFFF' stroke='#DFE5D0' stroke-width='3'/><rect x='70' y='160' width='300' height='330' rx='10' fill='#DEEAEE' stroke='#5E6652' stroke-width='3'/><rect x='73' y='230' width='294' height='257' fill='#A7CDDE'/><line x1='73' y1='230' x2='367' y2='230' stroke='#2E7D8C' stroke-width='3'/><rect x='20' y='510' width='400' height='128' rx='14' fill='#FFFFFF' stroke='#3B4A2F' stroke-width='3'/><rect x='20' y='510' width='400' height='30' rx='14' fill='#3B4A2F'/><rect x='20' y='526' width='400' height='14' fill='#3B4A2F'/><text x='220.0' y='532.0' font-size='19' text-anchor='middle' class='b' style='fill:#FFFFFF'>Zum Nachschlagen</text><text x='36.0' y='568.0' font-size='18' text-anchor='start'>schwebt: F<tspan font-size='70%' dy='5'>A</tspan> = F<tspan font-size='70%' dy='5'>G</tspan> (z. B. U-Boot)</text><text x='36.0' y='594.0' font-size='18' text-anchor='start'>sinkt: F<tspan font-size='70%' dy='5'>A</tspan> &lt; F<tspan font-size='70%' dy='5'>G</tspan> (z. B. Stein)</text><text x='36.0' y='618.0' font-size='17' text-anchor='start' class='m'>F<tspan font-size='70%' dy='5'>A</tspan> = Gewichtskraft des verdrängten Wassers</text><g><g opacity='0'><text x='220.0' y='116.0' font-size='21' text-anchor='middle' class='b'>1  Unter Wasser: Auftrieb größer.</text><animate attributeName='opacity' values='1;1;0;0;1;1' keyTimes='0.000;0.300;0.325;0.960;0.985;1.000' dur='12s' repeatCount='indefinite'/></g><g opacity='0'><text x='220.0' y='116.0' font-size='21' text-anchor='middle' class='b'>2  Der Ball steigt nach oben.</text><animate attributeName='opacity' values='0;0;1;1;0;0;0;0' keyTimes='0.000;0.325;0.350;0.620;0.645;0.960;0.985;1.000' dur='12s' repeatCount='indefinite'/></g><g opacity='1'><text x='220.0' y='116.0' font-size='21' text-anchor='middle' class='b'>3  Oben schwimmt er: Kräfte gleich.</text><animate attributeName='opacity' values='0;0;1;1;0;0' keyTimes='0.000;0.645;0.670;0.960;0.985;1.000' dur='12s' repeatCount='indefinite'/></g><g transform='translate(180.0 226.0)'><g opacity='0'><line x1='-24.0' y1='0.0' x2='-24.0' y2='-86.4' stroke='#2E7D8C' stroke-width='6' stroke-linecap='round'/><polygon points='-24.0,-96.0 -17.0,-81.6 -31.0,-81.6' fill='#2E7D8C'/><text x='-34.0' y='-60.0' font-size='21' text-anchor='end' class='b' style='fill:#2E7D8C'>F<tspan font-size='70%' dy='5'>A</tspan></text><line x1='24.0' y1='0.0' x2='24.0' y2='42.4' stroke='#A33A2B' stroke-width='6' stroke-linecap='round'/><polygon points='24.0,52.0 17.0,37.6 31.0,37.6' fill='#A33A2B'/><text x='34.0' y='40.0' font-size='21' text-anchor='start' class='b' style='fill:#A33A2B'>F<tspan font-size='70%' dy='5'>G</tspan></text><animate attributeName='opacity' values='1;1;0;0;1;1' keyTimes='0.000;0.600;0.630;0.960;0.985;1.000' dur='12s' repeatCount='indefinite'/></g><g opacity='1'><line x1='-24.0' y1='0.0' x2='-24.0' y2='-60.4' stroke='#2E7D8C' stroke-width='6' stroke-linecap='round'/><polygon points='-24.0,-70.0 -17.0,-55.6 -31.0,-55.6' fill='#2E7D8C'/><text x='-34.0' y='-44.0' font-size='21' text-anchor='end' class='b' style='fill:#2E7D8C'>F<tspan font-size='70%' dy='5'>A</tspan></text><line x1='24.0' y1='0.0' x2='24.0' y2='60.4' stroke='#A33A2B' stroke-width='6' stroke-linecap='round'/><polygon points='24.0,70.0 17.0,55.6 31.0,55.6' fill='#A33A2B'/><text x='34.0' y='52.0' font-size='21' text-anchor='start' class='b' style='fill:#A3