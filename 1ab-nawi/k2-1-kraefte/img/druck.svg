<svg xmlns="http://www.w3.org/2000/svg" class="k21a" viewBox="0 0 440 640" width="440" height="640" role="img" aria-label="Druck – animiert"><title>Druck – animiert</title><style>.k21a text{font-family:'Source Sans 3','Carlito','Segoe UI',Arial,sans-serif;fill:#1F2A1C} .k21a .b{font-weight:700} .k21a .m{fill:#5E6652}</style><rect width='440' height='640' rx='18' fill='#F2F3EE'/><text x='20.0' y='40.0' font-size='30' text-anchor='start' class='b'>Druck</text><text x='20.0' y='70.0' font-size='20' text-anchor='start' class='m'>p = F / A – Kraft durch Fläche</text><rect x='20' y='86' width='400' height='46' rx='12' fill='#FFFFFF' stroke='#DFE5D0' stroke-width='3'/><rect x='20' y='146' width='400' height='236' rx='14' fill='#FFFFFF' stroke='#7FA83A' stroke-width='3'/><rect x='20' y='146' width='400' height='30' rx='14' fill='#7FA83A'/><rect x='20' y='162' width='400' height='14' fill='#7FA83A'/><text x='220.0' y='168.0' font-size='19' text-anchor='middle' class='b' style='fill:#FFFFFF'>Gleiche Kraft: 600 N</text><rect x='20' y='410' width='400' height='178' rx='14' fill='#FFFFFF' stroke='#D9772B' stroke-width='3'/><rect x='20' y='410' width='400' height='30' rx='14' fill='#D9772B'/><rect x='20' y='426' width='400' height='14' fill='#D9772B'/><text x='220.0' y='432.0' font-size='19' text-anchor='middle' class='b' style='fill:#FFFFFF'>Luft lässt sich zusammendrücken</text><rect x='60' y='470' width='240' height='54' rx='8' fill='#DEEAEE' stroke='#5E6652' stroke-width='2'/><rect x='38' y='490' width='22' height='14' fill='#DEEAEE' stroke='#5E6652' stroke-width='2'/><circle cx='32' cy='497' r='14' fill='#E2C4A2' stroke='#1F2A1C' stroke-width='2'/><text x='32.0' y='534.0' font-size='15' text-anchor='middle' class='m'>Finger</text><text x='220.0' y='616.0' font-size='16' text-anchor='middle' class='m'>Druck ist keine Kraftart – er verbindet Kraft und Fläche.</text><g><g opacity='0'><text x='220.0' y='116.0' font-size='21' text-anchor='middle' class='b'>1  Schmale Sohle: sinkt