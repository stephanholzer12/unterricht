<svg xmlns="http://www.w3.org/2000/svg" class="k21a" viewBox="0 0 440 640" width="440" height="640" role="img" aria-label="Reibung – animiert"><title>Reibung – animiert</title><style>.k21a text{font-family:'Source Sans 3','Carlito','Segoe UI',Arial,sans-serif;fill:#1F2A1C} .k21a .b{font-weight:700} .k21a .m{fill:#5E6652}</style><rect width='440' height='640' rx='18' fill='#F2F3EE'/><text x='20.0' y='40.0' font-size='30' text-anchor='start' class='b'>Reibung</text><text x='20.0' y='70.0' font-size='20' text-anchor='start' class='m'>Sie hält fest, bremst – und lässt dich gehen.</text><rect x='20' y='86' width='400' height='46' rx='12' fill='#FFFFFF' stroke='#DFE5D0' stroke-width='3'/><rect x='20' y='146' width='400' height='220' rx='14' fill='#FFFFFF' stroke='#7FA83A' stroke-width='3'/><rect x='20' y='146' width='400' height='30' rx='14' fill='#7FA83A'/><rect x='20' y='162' width='400' height='14' fill='#7FA83A'/><text x='220.0' y='168.0' font-size='19' text-anchor='middle' class='b' style='fill:#FFFFFF'>Becher wird gezogen</text><rect x='30' y='320' width='380' height='14' fill='#DFE5D0' stroke='#5E6652' stroke-width='2'/><rect x='20' y='386' width='400' height='236' rx='14' fill='#FFFFFF' stroke='#D9772B' stroke-width='3'/><rect x='20' y='386' width='400' height='30' rx='14' fill='#D9772B'/><rect x='20' y='402' width='400' height='14' fill='#D9772B'/><text x='220.0' y='408.0' font-size='19' text-anchor='middle' class='b' style='fill:#FFFFFF'>Abstoßen beim Gehen</text><rect x='30' y='530' width='380' height='14' fill='#DFE5D0' stroke='#5E6652' stroke-width='2'/><text x='220.0' y='632.0' font-size='16' text-anchor='middle' class='m'>vereinfachtes Modell: F<tspan font-size='70%' dy='5'>R</tspan> = μ · F<tspan font-size='70%' dy='5'>N</tspan></text><g><g opacity='0'><text x='220.0' y='116.0' font-size='21' text-anchor='middle' class='b'>1  Leicht ziehen: Der Becher haftet.</text><animate attributeName='opacity' values='1;1;0;0;1;1' keyTimes='0.000;0.280;0.305;0.960;0.98