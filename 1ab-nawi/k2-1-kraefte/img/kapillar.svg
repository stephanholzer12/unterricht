<svg xmlns="http://www.w3.org/2000/svg" class="k21a" viewBox="0 0 440 600" width="440" height="600" role="img" aria-label="Kapillarwirkung – animiert"><title>Kapillarwirkung – animiert</title><style>.k21a text{font-family:'Source Sans 3','Carlito','Segoe UI',Arial,sans-serif;fill:#1F2A1C} .k21a .b{font-weight:700} .k21a .m{fill:#5E6652}</style><rect width='440' height='600' rx='18' fill='#F2F3EE'/><text x='20.0' y='40.0' font-size='30' text-anchor='start' class='b'>Kapillarwirkung</text><text x='20.0' y='70.0' font-size='20' text-anchor='start' class='m'>Wasser steigt in engen, benetzbaren Spalten.</text><rect x='20' y='86' width='400' height='46' rx='12' fill='#FFFFFF' stroke='#DFE5D0' stroke-width='3'/><rect x='34' y='160' width='180' height='330' rx='14' fill='#FFFFFF' stroke='#7FA83A' stroke-width='3'/><text x='124.0' y='186.0' font-size='19' text-anchor='middle' class='b' style='fill:#7FA83A'>Filterpapier</text><rect x='54' y='380' width='140' height='96' rx='6' fill='#DEEAEE' stroke='#5E6652' stroke-width='2'/><rect x='56' y='410' width='136' height='64' fill='#A7CDDE'/><rect x='104' y='206' width='40' height='226' fill='#FFFFFF' stroke='#5E6652' stroke-width='2'/><rect x='105' y='258' width='38' height='173' fill='#A7CDDE' opacity='0.85'><animate attributeName='y' values='431;431;420;258;258;431;431' keyTimes='0.000;0.180;0.220;0.540;0.960;0.985;1.000' dur='12s' repeatCount='indefinite'/><animate attributeName='height' values='0;0;11;173;173;0;0' keyTimes='0.000;0.180;0.220;0.540;0.960;0.985;1.000' dur='12s' repeatCount='indefinite'/></rect><text x='124.0' y='504.0' font-size='16' text-anchor='middle' class='m'>Wasserspiegel</text><rect x='226' y='160' width='180' height='330' rx='14' fill='#FFFFFF' stroke='#D9772B' stroke-width='3'/><text x='316.0' y='186.0' font-size='19' text-anchor='middle' class='b' style='fill:#D9772B'>enges Röhrchen</text><rect x='246' y='400' width='140' height='76' rx='6' fill='#DEEAEE' stroke='#5E6652' stroke-width='2'/><rect x='248' y='420' width='136' height='54' fill='#A7CDDE'/><rect x='305' y='210' width='22' height='250' fill='#DEEAEE' stroke='#5E6652' stroke-width='2'/><rect x='307' y='300' width='18' height='158' fill='#A7CDDE'><animate attributeName='y' values='420;420;300;300;420;420' keyTimes='0.000;0.580;0.860;0.960;0.985;1.000' dur='12s' repeatCount='indefinite'/><animate attributeName='height' values='38;38;158;158;38;38' keyTimes='0.000;0.580;0.860;0.960;0.985;1.000' dur='12s' repeatCount='indefinite'/></rect><text x='316.0' y='504.0' font-size='16' text-anchor='middle' class='m'>Wasserspiegel</text><text x='20.0' y='540.0' font-size='18' text-anchor='start' class='b'>Adhäsion = Anziehung verschiedener Stoffe</text><text x='20.0' y='566.0' font-size='18' text-anchor='start' class='b'>Kohäsion = Zusammenhalt in einem Stoff</text><text x='20.0' y='590.0' font-size='17' text-anchor='start' class='m'>Je enger das Röhrchen, desto höher steigt es.</text><g><g opacity='0'><text x='220.0' y='116.0' font-size='21' text-anchor='middle' class='b'>1  Der Streifen taucht ins Wasser.</text><animate attributeName='opacity' values='1;1;0;0;1;1' keyTimes='0.000;0.200;0.225;0.960;0.985;1.000' dur='12s' repeatCount='indefinite'/></g><g opacity='0'><text x='220.0' y='116.0' font-size='21' text-anchor='middle' class='b'>2  Das Wasser kriecht hoch.</text><animate attributeName='opacity' values='0;0;1;1;0;0;0;0' keyTimes='0.000;0.225;0.250;0.560;0.585;0.960;0.985;1.000' dur='12s' repeatCount='indefinite'/></g><g opacity='1'><text x='220.0' y='116.0' font-size='21' text-anchor='middle' class='b'>3  Im Röhrchen steigt es auch.</text><animate attributeName='opacity' values='0;0;1;1;0;0' keyTimes='0.000;0.585;0.610;0.960;0.985;1.000' dur='12s' repeatCount='indefinite'/></g><g opacity='1'><line x1='176.0' y1='420.0' x2='176.0' y2='279.2' stroke='#7FA83A' stroke-width='4' stroke-linecap='round'/><polygon points='176.0,272.0 181.2,282.8 170.8,282.8' fill='#7FA83A'/><text x='176.0' y='258.0' font-size='16' text-anchor='middle' class='b' style='fill:#7FA83A'>steigt</text><animate attributeName='opacity' values='0;0;1;1;0;0' keyTimes='0.000;0.400;0.430;0.960;0.985;1.000' dur='12s' repeatCount='indefinite'/></g><g transform='translate(0.0 300.0)'><path d='M 307 0 Q 316 10 325 0' fill='none' stroke='#2E7D8C' stroke-width='3'/><animateTransform attributeName='transform' type='translate' values='0.0 420.0;0.0 420.0;0.0 300.0;0.0 300.0;0.0 420.0;0.0 420.0' keyTimes='0.000;0.580;0.860;0.960;0.985;1.000' dur='12s' repeatCount='indefinite'/></g><g opacity='1'><line x1='286.0' y1='420.0' x2='286.0' y2='311.2' stroke='#7FA83A' stroke-width='4' stroke-linecap='round'/><polygon points='286.0,304.0 291.2,314.8 280.8,314.8' fill='#7FA83A'/><text x='280.0' y='360.0' font-size='16' text-anchor='end' class='b' style='fill:#7FA83A'>Steig-</text><text x='280.0' y='378.0' font-size='16' text-anchor='end' class='b' style='fill:#7FA83A'>höhe</text><animate attributeName='opacity' values='0;0;1;1;0;0' keyTimes='0.000;0.860;0.890;0.960;0.985;1.000' dur='12s' repeatCount='indefinite'/></g><g opacity='1'><text x='333.0' y='232.0' font-size='16' text-anchor='start' class='b' style='fill:#D9772B'>Adhäsion</text><text x='333.0' y='250.0' font-size='15' text-anchor='start' style='fill:#D9772B'>an der</text><text x='333.0' y='266.0' font-size='15' text-anchor='start' style='fill:#D9772B'>Wand</text><animate attributeName='opacity' values='0;0;1;1;0;0' keyTimes='0.000;0.620;0.650;0.960;0.985;1.000' dur='12s' repeatCount='indefinite'/></g><animate attributeName='opacity' values='1;1;0;0;1' keyTimes='0;0.920;0.96;0.985;1' dur='12s' repeatCount='indefinite'/></g></svg>